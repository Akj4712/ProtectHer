<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProtectHer</title>
<style>
:root{--bg:#f4f6fb;--sf:#fff;--tx:#0f1b3d;--mu:#667085;--ln:#e4e8f1;--navy:#0f1b3d;--g:#10b981;--gl:#d1fae5;--gd:#047857;--y:#f59e0b;--yl:#fef3c7;--yd:#92400e;--r:#ef4444;--rl:#fee2e2;--rd:#991b1b;--sh:0 6px 20px rgba(15,27,61,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--sf:#151c33;--tx:#eef1fa;--mu:#9aa4bf;--ln:#26304f;--navy:#1b2a5c;--gl:#064e3b;--gd:#6ee7b7;--yl:#451a03;--yd:#fcd34d;--rl:#450a0a;--rd:#fca5a5}}
:root[data-theme="dark"]{--bg:#0b1020;--sf:#151c33;--tx:#eef1fa;--mu:#9aa4bf;--ln:#26304f;--navy:#1b2a5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--tx)}
#app{max-width:430px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--ln)}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 28px}#main>div{animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:23px;margin:0 0 4px;letter-spacing:-.4px}h2{font-size:16px;margin:20px 0 10px}p{margin:3px 0}.mu{color:var(--mu);font-size:13px}.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g1{flex:1;min-width:0}
.card{background:var(--sf);border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);transition:transform .15s}.tap{cursor:pointer}.tap:active{transform:scale(.97)}
.hero{background:linear-gradient(145deg,#0f1b3d,#1e3a8a);color:#fff;border-radius:24px;padding:18px;margin-bottom:12px}.hero .mu{color:#b6c2e6}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:16px;font-size:16px;font-weight:700;background:linear-gradient(135deg,#0f1b3d,#1d4ed8);color:#fff;margin-top:10px;cursor:pointer;transition:transform .12s}.btn:active{transform:scale(.97)}
.btn.o{background:var(--sf);color:var(--tx);box-shadow:inset 0 0 0 1px var(--ln)}.btn.red{background:var(--r)}.btn.gr{background:var(--g)}.btn.sm{width:auto;min-height:40px;padding:0 14px;margin:0;font-size:14px;border-radius:12px}
.bd{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}.b-g{background:var(--gl);color:var(--gd)}.b-y{background:var(--yl);color:var(--yd)}.b-r{background:var(--rl);color:var(--rd)}.b-n{background:#e0e7ff;color:#3730a3}
input,textarea{width:100%;border:0;outline:0;font-size:16px;font-family:inherit;background:transparent;color:var(--tx);padding:12px 0}
.srch{background:var(--sf);border-radius:18px;padding:2px 14px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.chip{flex:none;padding:9px 15px;border-radius:99px;background:var(--sf);font-size:13px;font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1px var(--ln);transition:.15s}.chip.on{background:var(--navy);color:#fff}
.ib{width:42px;height:42px;border-radius:14px;background:var(--sf);box-shadow:var(--sh);display:grid;place-items:center;border:0;color:var(--tx);cursor:pointer;position:relative}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}.i-g{background:var(--gl);color:var(--gd)}.i-y{background:var(--yl);color:var(--yd)}.i-r{background:var(--rl);color:var(--rd)}.i-n{background:#e0e7ff;color:#3730a3}
svg{width:22px;height:22px;fill:currentColor}.bar{height:8px;border-radius:9px;background:var(--ln);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;border-radius:9px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.sc{font-size:34px;font-weight:800;letter-spacing:-1px}.back{background:none;border:0;color:var(--mu);font-size:15px;padding:0 0 12px;cursor:pointer;font-weight:600}
nav{display:flex;background:var(--sf);border-top:1px solid var(--ln);padding:4px 6px}nav button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:11px;font-weight:600;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;cursor:pointer;position:relative}nav button.on{color:var(--tx)}nav button.on:after{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:3px;background:var(--g)}
.map{border-radius:22px;overflow:hidden;position:relative;background:#e9eef0;margin-bottom:12px}.map svg{width:100%;height:100%;display:block}
.ctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}.sheet{background:var(--sf);border-radius:24px 24px 0 0;padding:10px 16px 14px;box-shadow:0 -8px 24px rgba(15,27,61,.12);margin:0 -16px -28px;animation:in .35s}.grab{width:40px;height:4px;border-radius:4px;background:var(--ln);margin:0 auto 12px}
.warn{display:flex;gap:12px;background:var(--yl);color:var(--yd);border-radius:18px;padding:13px;margin:10px 0;font-size:14px}.sel{box-shadow:0 0 0 2px var(--g),var(--sh)}
.steps{display:flex;gap:6px;margin:6px 0 16px}.steps div{flex:1;font-size:11px;font-weight:700;color:var(--mu)}.steps div:before{content:"";display:block;height:4px;border-radius:4px;background:var(--ln);margin-bottom:6px}.steps .d{color:var(--tx)}.steps .d:before{background:var(--g)}
#toast{position:absolute;left:16px;right:16px;bottom:78px;background:#0f1b3d;color:#fff;padding:12px 14px;border-radius:14px;font-size:14px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:9}#toast.on{opacity:1;transform:none}
.em{background:#050506;color:#fff;--sf:#16171b;--bg:#050506;--tx:#fff;--mu:#a1a1aa;--ln:#2a2b31}.em #main{background:#050506}
.sos{position:relative;width:200px;height:200px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff6b6b,#dc2626);color:#fff;font-size:46px;font-weight:900;display:block;margin:26px auto;user-select:none;touch-action:none;cursor:pointer}
.sos:before{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px solid #ef4444;animation:pu 1.8s infinite}@keyframes pu{from{transform:scale(.92);opacity:.9}to{transform:scale(1.15);opacity:0}}
.hold{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#fbbf24 var(--p,0%),transparent 0)}.sos span{position:relative}.tl div{padding:8px 0 8px 18px;border-left:2px solid #3f3f46;position:relative;font-size:14px}.tl div:before{content:"";position:absolute;left:-6px;top:13px;width:10px;height:10px;border-radius:50%;background:#ef4444}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--ln);border-top-color:var(--g);animation:sp 1s linear infinite;margin:0 auto}@keyframes sp{to{transform:rotate(360deg)}}
.pulse{animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.35}}
</style></head><body><div id="app"><div id="main"></div><nav id="nav"></nav><div id="toast"></div></div>
<script>
const P={home:'M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z',map:'M20.5 3L15 5.1 9 3 3.4 4.9c-.2.1-.4.3-.4.5V20.5c0 .3.2.5.5.5L9 18.9l6 2.1 5.6-1.9c.2-.1.4-.3.4-.5V3.5c0-.3-.2-.5-.5-.5zM15 19l-6-2.1V5l6 2.1V19z',people:'M16 11c1.7 0 3-1.3 3-3s-1.3-3-3-3-3 1.3-3 3 1.3 3 3 3zm-8 0c1.7 0 3-1.3 3-3S9.7 5 8 5 5 6.3 5 8s1.3 3 3 3zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5c0-2.3-4.7-3.5-7-3.5zm8 0c-.3 0-.6 0-1 .1 1.2.8 2 2 2 3.4V19h6v-2.5c0-2.3-4.7-3.5-7-3.5z',shield:'M12 1L3 5v6c0 5.6 3.8 10.7 9 12 5.2-1.3 9-6.4 9-12V5l-9-4z',person:'M12 12c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z',warn:'M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z',search:'M15.5 14h-.8l-.3-.3A6.5 6.5 0 0016 9.5 6.5 6.5 0 109.5 16c1.6 0 3.1-.6 4.2-1.6l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0C7 14 5 12 5 9.5S7 5 9.5 5 14 7 14 9.5 12 14 9.5 14z',bell:'M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.1-1.6-5.6-4.5-6.3V4c0-.8-.7-1.5-1.5-1.5s-1.5.7-1.5 1.5v.7C7.6 5.4 6 7.9 6 11v5l-2 2v1h16v-1l-2-2z',pin:'M12 2C8.1 2 5 5.1 5 9c0 5.3 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z',bulb:'M9 21c0 .6.4 1 1 1h4c.6 0 1-.4 1-1v-1H9v1zm3-19C8.1 2 5 5.1 5 9c0 2.4 1.2 4.5 3 5.7V17c0 .6.4 1 1 1h6c.6 0 1-.4 1-1v-2.3c1.8-1.2 3-3.3 3-5.7 0-3.9-3.1-7-7-7z',sig:'M2 22h20V2z',phone:'M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.3 1l-2.2 2.2z',plus:'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z',minus:'M19 13H5v-2h14v2z',loc:'M12 8c-2.2 0-4 1.8-4 4s1.8 4 4 4 4-1.8 4-4-1.8-4-4-4zm8.9 3A9 9 0 0013 3.1V1h-2v2.1A9 9 0 003.1 11H1v2h2.1A9 9 0 0011 20.9V23h2v-2.1A9 9 0 0020.9 13H23v-2h-2.1zM12 19c-3.9 0-7-3.1-7-7s3.1-7 7-7 7 3.1 7 7-3.1 7-7 7z',ok:'M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z',nav:'M12 2L4.5 20.3l.7.7 6.8-3 6.8 3 .7-.7z',store:'M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6zm-9 4H6v-4h6v4z',med:'M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z',fuel:'M19.8 7.2l-3.7-3.7L15 4.6l2.1 2.1c-.9.4-1.6 1.3-1.6 2.3 0 1.4 1.1 2.5 2.5 2.5.4 0 .7-.1 1-.2v7.200c0 .6-.4 1-1 1s-1-.4-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.100 0-2 .9-2 2v16h10v-7.500h1.500v5c0 1.400 1.100 2.500 2.500 2.500s2.500-1.100 2.500-2.500V9c0-.7-.3-1.300-.7-1.800z',cam:'M12 15.2a3.2 3.200 0 100-6.400 3.200 3.200 0 000 6.400zM9 2L7.200 4H4c-1.100 0-2 .9-2 2v12c0 1.100.9 2 2 2h16c1.100 0 2-.9 2-2V6c0-1.100-.9-2-2-2h-3.200L15 2z',clock:'M12 2a10 10 0 100 20 10 10 0 000-20zm4.2 14.200L11 13V7h1.500v5.200l4.500 2.700z'};
const ic=n=>`<svg viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const $=s=>document.querySelector(s);
const bd=(c,t)=>`<span class="bd b-${c}">${t}</span>`;
const R=[{id:'A',n:'Safest Route',s:92,eta:24,km:'8.2',c:'g',lab:'Recommended',d:'M44 236C84 214 98 168 150 150S236 104 300 70L336 40',f:['86% streetlight coverage','High pedestrian activity','Police station 400 m away','No recent high-risk reports','Strong network']},
{id:'B',n:'Balanced Route',s:78,eta:19,km:'6.9',c:'y',lab:'Moderate risk',d:'M44 236C100 220 150 190 190 150S270 90 336 40',f:['71% streetlight coverage','Moderate activity','Hospital 1.2 km away','1 recent report on route','Good network']},
{id:'C',n:'Shortest Route',s:61,eta:15,km:'5.4',c:'r',lab:'Higher risk',d:'M44 236L336 40',f:['38% streetlight coverage','Low activity after 7 PM','2 dark segments','Weak network (1.1 km)','Nearest police 2.4 km']}];
const REP=[['Broken Streetlight','RS Puram Road','12 min ago','Open','14','y','bulb','recent'],['Crowd Activity','Gandhipuram Bus Stand','25 min ago','Active','9','g','people','near'],['Unsafe Location','Trichy Road Underpass','1 hr ago','Under review','6','r','warn','risk'],['New Streetlight','Avinashi Road Junction','3 hr ago','Resolved','11','g','bulb','done']];
const PL=[['Race Course Police Station','0.4 km','Open 24 hours','Police','shield'],['KMCH Hospital','1.2 km','Open 24 hours','Hospitals','med'],['Apollo Pharmacy','0.6 km','Open till 11 PM','Pharmacies','med'],['Indian Oil Fuel Station','1.0 km','Open 24 hours','Fuel','fuel'],['Brookefields Mall','3.1 km','Open till 10 PM','Public Places','store']];
const REC=['Gandhipuram','Brookefields Mall','Coimbatore Junction'];
let S={tab:'home',v:'home',r:R[0],dev:false,dest:'Gandhipuram',rep:null,rs:1,photo:false,cf:'Nearby',pc:'Police',es:0,log:[],prog:0};
const col=c=>c=='g'?'#10b981':c=='y'?'#f59e0b':'#ef4444';
function map(h,o={}){const r=o.r||S.r,c=col(r.c);return `<div class="map" style="height:${h}px"><svg viewBox="0 0 380 260" preserveAspectRatio="xMidYMid slice"><rect width="380" height="260" fill="#e9eef0"/><path d="M-10 60C80 90 120 40 200 70S330 120 400 90V0H-10z" fill="#cfe3f3"/><rect x="230" y="150" width="90" height="70" rx="14" fill="#d5ead2"/><rect x="20" y="150" width="60" height="50" rx="12" fill="#d5ead2"/>
<g stroke="#fff" stroke-width="12" fill="none"><path d="M0 120H380M0 190H380M110 0V260M250 0V260M0 40L380 240"/></g><g stroke="#fff" stroke-width="5" fill="none"><path d="M180 0V260M0 80H380"/></g>
<circle cx="120" cy="140" r="34" fill="#ef444440"/><path d="${r.d}" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round"/><path d="${r.d}" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round" ${r.c=='r'?'stroke-dasharray="2 9"':''}/>
${o.dev?'<path d="M150 150L200 215L250 232" stroke="#f97316" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="10 6"/>':''}
<g fill="#f59e0b"><circle cx="100" cy="120" r="4"/><circle cx="190" cy="120" r="4"/><circle cx="260" cy="95" r="4"/><circle cx="150" cy="190" r="4"/></g>
<g><circle cx="270" cy="85" r="11" fill="#1e3a8a"/><circle cx="90" cy="190" r="11" fill="#0ea5e9"/><circle cx="300" cy="190" r="11" fill="#10b981"/><circle cx="60" cy="100" r="11" fill="#10b981"/></g><g fill="#fff"><path d="M270 79l5 2v3c0 3-2 5-5 6-3-1-5-3-5-6v-3z"/><path d="M88 184h4v4h4v4h-4v4h-4v-4h-4v-4h4z"/></g>
${o.nomark?'':`<circle cx="336" cy="40" r="9" fill="#ef4444"/><circle cx="336" cy="40" r="3.500" fill="#fff"/>`}
<circle cx="${o.dev?200:o.me||44}" cy="${o.dev?215:o.me?150:236}" r="16" fill="#2563eb33" class="pulse"/><circle cx="${o.dev?200:o.me||44}" cy="${o.dev?215:o.me?150:236}" r="8" fill="#2563eb" stroke="#fff" stroke-width="3"/></svg>${o.ctl?`<div class="ctl"><button class="ib" onclick="toast('Zoom in (mock map)')">${ic('plus')}</button><button class="ib" onclick="toast('Zoom out (mock map)')">${ic('minus')}</button><button class="ib" onclick="toast('Centred on simulated location')">${ic('loc')}</button></div>`:''}</div>`}
function arc(v,c){const L=2*Math.PI*52;return `<svg viewBox="0 0 120 120" style="width:120px;height:120px"><circle cx="60" cy="60" r="52" stroke="#ffffff22" stroke-width="10" fill="none"/><circle class="arc" data-v="${v}" cx="60" cy="60" r="52" stroke="${c}" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L}" transform="rotate(-90 60 60)" style="transition:stroke-dashoffset 1.2s ease"/><text x="60" y="64" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">${v}</text><text x="60" y="82" text-anchor="middle" font-size="10" fill="#b6c2e6">/100</text></svg>`}
const bar=(v,c)=>`<div class="bar"><i data-w="${v}" style="background:${col(c)}"></i></div>`;
const rep=r=>`<div class="card row tap" onclick="toast('Report detail (demo)')"><div class="ico i-${r[5]}">${ic(r[6])}</div><div class="g1"><b>${r[0]}</b><p class="mu">${r[1]} · ${r[2]}</p><p class="mu">${r[4]} people confirmed</p></div>${bd(r[5],r[3])}</div>`;
const back=t=>`<button class="back" onclick="go('${t}')">← Back</button>`;
function go(v,t){S.v=v;if(t)S.tab=t;draw()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
function plan(){const i=$('#dst');S.dest=(i&&i.value.trim())||S.dest;go('load')}
function pick(i){S.r=R[i];go('detail')}
function tm(){return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false})}
function logE(t){S.log.push(tm()+' — '+t)}
function emerg(){S.es=0;S.log=[];S.prog=0;go('emg')}
let ht=null;function hs(){if(ht)return;let s=Date.now();ht=setInterval(()=>{const p=Math.min(100,(Date.now()-s)/12);const e=$('.hold');if(e)e.style.setProperty('--p',p+'%');if(p>=100)act()},30)}
function he(){clearInterval(ht);ht=null;const e=$('.hold');if(e)e.style.setProperty('--p','0%')}
function act(){he();S.es=1;logE('SOS activated');logE('Location shared (simulated)');logE('Contacts notified (simulated)');logE('Assistance requested (simulated)');draw()}
const V={
home:()=>`<div><div class="row sp"><div><p class="mu row">${ic('pin')} Coimbatore, Tamil Nadu</p><h1>Good evening, Priya</h1></div><div class="row"><button class="ib" onclick="toast('No new notifications')">${ic('bell')}</button><button class="ib" style="background:var(--navy);color:#fff;font-weight:800" onclick="go('profile','profile')">P</button></div></div>
<p class="mu" style="margin-bottom:14px">You're protected. Let's plan your journey safely.</p>
<div class="srch">${ic('search')}<input id="dst" placeholder="Where are you going?" onkeydown="if(event.key=='Enter')plan()"></div>
<div class="chips">${REC.map(x=>`<div class="chip" onclick="$('#dst').value='${x}'">${x}</div>`).join('')}</div>
<button class="btn" onclick="plan()">Plan Safe Route →</button>
<div class="hero" style="margin-top:16px"><div class="row sp"><div><p class="mu">Your Area Safety</p><div class="sc">SAFE</div><p class="mu">Prototype estimate from community data</p></div>${arc(84,'#34d399')}</div>
<div class="grid" style="margin-top:12px;font-size:13px"><p>Streetlights 86%</p><p>Activity: High</p><p>Network: Strong</p><p>Incidents: Low</p></div></div>
<div class="grid"><div class="card tap" onclick="go('routes_in')"><div class="ico i-n">${ic('shield')}</div><b style="display:block;margin-top:8px">Safe Route</b></div>
<div class="card tap" onclick="emerg()"><div class="ico i-r">${ic('warn')}</div><b>Emergency</b></div>
<div class="card tap" onclick="go('places')"><div class="ico i-g">${ic('pin')}</div><b>Safe Places</b></div>
<div class="card tap" onclick="S.rs=1;go('r1','community')"><div class="ico i-y">${ic('bell')}</div><b>Report Issue</b></div></div>
<div class="row sp"><h2>Safety Around You</h2></div>${REP.slice(0,3).map(rep).join('')}<button class="btn o" onclick="go('community','community')">View all reports →</button></div>`,
routes_in:()=>{S.dest=S.dest||'Gandhipuram';return V.load()},
load:()=>{setTimeout(()=>{if(S.v=='load')go('routes')},1100);return `<div style="text-align:center;padding-top:90px"><div class="spin"></div><h2>Analyzing safety conditions</h2><p class="mu">Streetlights · activity · reports · emergency access</p></div>`},
routes:()=>`<div>${back('home')}<h1>Choose your safest route</h1><p class="mu">ProtectHer analyzed safety conditions along your journey to ${S.dest}.</p><div style="height:12px"></div>
${R.map((r,i)=>`<div class="card ${i==0?'sel':''}"><div class="row sp">${bd(r.c,r.lab)}<span class="mu">${r.eta} min · ${r.km} km</span></div><div class="row sp" style="margin-top:8px"><div><div class="sc" style="color:${col(r.c)}">${r.s}</div><span class="mu">Safety Score</span></div><div class="mu" style="text-align:right;font-size:12px">${r.f.slice(0,3).map(f=>(r.c=='r'?'! ':'✓ ')+f).join('<br>')}</div></div>${bar(r.s,r.c)}<button class="btn ${i?'o':''}" onclick="pick(${i})">Select Route</button></div>`).join('')}
<div class="warn">${ic('warn')}<div><b>Saves 9 minutes but has significantly higher safety risk.</b><br>The fastest route isn't always the safest.</div></div></div>`,
detail:()=>{const r=S.r;return `<div>${back('routes')}<div class="row sp"><h1>${r.n}</h1>${bd(r.c,r.lab)}</div>${map(190,{ctl:1})}<div class="card row sp"><div><div class="sc" style="color:${col(r.c)}">${r.s}/100</div><span class="mu">${r.eta} min · ${r.km} km</span></div></div>
<h2>AI Safety Analysis</h2>${[['bulb','Streetlight Coverage',r.f[0],r.c],['people','Activity Level',r.f[1],r.c],['shield','Emergency Access',r.f[4==0?0:2],r.c],['sig','Network',r.c=='r'?'Weak':'Strong',r.c],['warn','Recent Reports',r.f[3],r.c]].map(a=>`<div class="card row"><div class="ico i-${a[3]}">${ic(a[0])}</div><div class="g1"><b>${a[1]}</b><p class="mu">${a[2]}</p></div></div>`).join('')}
<div class="card"><b>Why this route?</b><p class="mu" style="margin-top:6px">${r.c=='g'?'It stays on well-lit, busy roads near police and open places, even though it takes longer.':r.c=='y'?'A compromise: quicker, with one reported issue and fewer open places.':'It is the fastest but crosses dark, low-activity segments with weak coverage.'} Scores are prototype, community-based estimates.</p></div>
<button class="btn" onclick="go('brief')">Start Safe Journey</button></div>`},
brief:()=>`<div>${back('detail')}<h1>Your Safety Brief</h1><p class="mu">Coimbatore → ${S.dest}</p><div style="height:10px"></div><div class="grid"><div class="card"><p class="mu">Destination Risk</p>${bd('y','Moderate')}</div><div class="card"><p class="mu">Network</p>${bd('g','Good')}</div><div class="card"><p class="mu">High-risk segments</p><b style="font-size:22px">1</b></div><div class="card"><p class="mu">Estimated arrival</p><b style="font-size:22px">7:35 PM</b></div></div>
<h2>Safety Checkpoints</h2><div class="card row"><div class="ico i-n">${ic('pin')}</div><div><b>Police Station</b><p class="mu">0.4 km</p></div></div><div class="card row"><div class="ico i-g">${ic('pin')}</div><div><b>Safe Public Area</b><p class="mu">3.1 km</p></div></div>
<h2>Emergency Information</h2><div class="card">Police <b>100</b> · Ambulance <b>108</b> · Women Helpline <b>1091</b></div><button class="btn" onclick="S.dev=false;S.prog=0;go('nav')">Start Safe Journey →</button></div>`,
nav:()=>S.dev?`<div><div class="warn" style="background:var(--rl);color:var(--rd)">${ic('warn')}<div><b>Route Deviation Detected</b><br>You have moved away from your planned safer route.</div></div>${map(220,{dev:1,r:R[0]})}<div class="card"><b>ProtectHer recommends returning to the safer route.</b><p class="mu">Green: planned route · Orange: current path</p></div><button class="btn gr" onclick="S.dev=false;toast('Back on safer route');draw()">Return to Safe Route</button><button class="btn o" onclick="toast('Continuing off-route. Stay alert.');go('home','home')">Continue Anyway</button></div>`
:`<div class="row sp"><div><h1>${S.r.n}</h1><p class="mu">ETA 7:35 PM</p></div><button class="btn red sm" onclick="emerg()">Emergency</button></div><div style="height:10px"></div>${map(300,{me:140,ctl:1,r:S.r,nomark:0})}
<div class="sheet"><div class="grab"></div><div class="row sp"><div><p class="mu">Next instruction</p><b style="font-size:20px">Turn left in 300 m</b></div><div style="text-align:right"><div class="sc" style="font-size:26px;color:var(--g)">${S.r.s}</div><span class="mu">score</span></div></div>
<div class="card row" style="background:var(--gl);color:var(--gd);margin:10px 0;box-shadow:none">${ic('ok')}<b>You are following your safer route.</b></div><div class="row sp mu"><span>Network: Strong</span><span>Progress 42%</span></div>${bar(42,'g')}
<button class="btn o" onclick="S.dev=true;draw()">Simulate deviation (demo)</button><button class="btn o" onclick="toast('Journey ended');go('home','home')">End journey</button></div>`,
explore:()=>`<div><div class="srch" style="margin-bottom:10px">${ic('search')}<input placeholder="Search places or locations" onkeydown="if(event.key=='Enter')toast('Search is mock-only')"></div>${map(330,{ctl:1,me:150,nomark:1})}
<div class="sheet"><div class="grab"></div><div class="row sp"><b style="font-size:18px">Safety Around You</b>${bd('g','Score 84')}</div>${[['Police','0.4 km','shield','n'],['Hospital','1.2 km','med','r'],['Safe place','0.6 km','store','g']].map(a=>`<div class="row sp" style="padding:10px 0"><div class="row"><div class="ico i-${a[3]}">${ic(a[2])}</div><b>${a[0]}</b></div><span class="mu">${a[1]}</span></div>`).join('')}<p class="mu">Mock map · will be replaced by OpenStreetMap + OpenRouteService.</p></div></div>`,
community:()=>{const f={Nearby:'near',Recent:'recent','High Risk':'risk',Resolved:'done'}[S.cf];const L=REP.filter(r=>r[7]==f||S.cf=='Nearby'&&r[7]!='done');return `<div><h1>Community Safety</h1><p class="mu">People around you are helping make routes safer.</p><div class="chips">${['Nearby','Recent','High Risk','Resolved'].map(c=>`<div class="chip ${S.cf==c?'on':''}" onclick="S.cf='${c}';draw()">${c}</div>`).join('')}</div>${L.length?L.map(rep).join(''):'<p class="mu">No reports.</p>'}<button class="btn" onclick="S.rs=1;S.rep=null;go('r1')">＋ Report Safety Issue</button></div>`},
r1:()=>`<div>${back('community')}${stp(1)}<h1>What happened?</h1><div class="grid" style="margin-top:12px">${[['Broken Streetlight','bulb'],['Unsafe Location','warn'],['Local Threat','warn'],['Road Problem','nav'],['Crowd / Activity','people'],['New Streetlight','bulb']].map(o=>`<div class="card tap ${S.rep==o[0]?'sel':''}" onclick="S.rep='${o[0]}';draw()"><div class="ico i-n">${ic(o[1])}</div><b style="display:block;margin-top:8px">${o[0]}</b></div>`).join('')}</div><button class="btn" onclick="S.rep?go('r2'):toast('Select an issue first')">Next</button></div>`,
r2:()=>`<div>${back('r1')}${stp(2)}<h1>Where did it happen?</h1>${map(180,{me:140,nomark:1})}<div class="card row">${ic('pin')}<div><b>Current location (simulated)</b><p class="mu">RS Puram, Coimbatore</p></div></div><button class="btn" onclick="go('r3')">Next</button></div>`,
r3:()=>`<div>${back('r2')}${stp(3)}<h1>Tell us more</h1><div class="card"><textarea rows="4" placeholder="Describe what you saw (optional)"></textarea></div><div class="card row tap" style="border:2px dashed var(--ln)" onclick="S.photo=!S.photo;draw()">${ic('cam')}<span>${S.photo?'Photo attached (demo)':'Add photo (optional)'}</span></div><button class="btn" onclick="go('r4')">Submit Report</button></div>`,
r4:()=>`<div style="text-align:center">${stp(4)}<div class="ico i-g" style="width:84px;height:84px;border-radius:50%;margin:30px auto 14px"><svg viewBox="0 0 24 24" style="width:44px;height:44px"><path d="${P.ok}"/></svg></div><h1>Report Submitted</h1><p class="mu">Your report helps make routes safer for everyone.</p><button class="btn" onclick="go('community','community')">Back to Community</button></div>`,
places:()=>{const cats=['Police','Hospitals','Pharmacies','Fuel','Public Places'];return `<div>${back('home')}<h1>Nearby Safe Places</h1><div class="chips">${cats.map(c=>`<div class="chip ${S.pc==c?'on':''}" onclick="S.pc='${c}';draw()">${c}</div>`).join('')}</div>${PL.filter(p=>p[3]==S.pc).map(p=>`<div class="card"><div class="row"><div class="ico i-n">${ic(p[4])}</div><div class="g1"><b>${p[0]}</b><p class="mu">${p[1]} · ${p[2]}</p></div></div><div class="row" style="margin-top:10px"><button class="btn sm" style="flex:1" onclick="toast('Directions (mock)')">${ic('nav')} Directions</button><button class="btn sm o" style="flex:1" onclick="toast('Call (simulated)')">${ic('phone')} Call</button></div></div>`).join('')}</div>`},
safety:()=>`<div><h1>Safety</h1><div class="hero"><div class="row sp"><div><p class="mu">Current Safety Score</p><div class="sc">SAFE</div><p class="mu">Today's journey: none active</p></div>${arc(84,'#34d399')}</div></div>
${[['Network','Good','g','sig'],['Activity','High','g','people'],['Streetlight','Moderate','y','bulb'],['Emergency access','Good','g','shield']].map(a=>`<div class="card row sp"><div class="row"><div class="ico i-${a[2]}">${ic(a[3])}</div><b>${a[0]}</b></div>${bd(a[2],a[1])}</div>`).join('')}
<div class="warn">${ic('warn')}<div><b>Safety Alert</b><br>1 dark segment detected ahead on Trichy Road.</div></div><button class="btn o" onclick="go('places')">Nearby Emergency Facilities</button><button class="btn red" onclick="emerg()">Emergency Mode</button></div>`,
profile:()=>`<div style="text-align:center"><div class="ico" style="width:78px;height:78px;border-radius:50%;background:var(--navy);color:#fff;font-size:30px;font-weight:800;margin:6px auto">P</div><h1>Priya S.</h1><p class="mu">Coimbatore</p></div><div class="hero" style="margin-top:14px"><p class="mu">ProtectHer Safety ID</p><b style="font-size:20px;letter-spacing:2px">PH-2026-0417</b></div>
${['Safety Preferences','Emergency Contacts','Notifications','Privacy & Location','Trusted Contacts','About ProtectHer','Help & Support'].map(x=>`<div class="card tap row sp" onclick="toast('${x} (demo)')"><b>${x}</b><span class="mu">›</span></div>`).join('')}<p class="mu">Prototype · simulated data only</p>`,
emg:()=>{const e=S.es;return `<div style="text-align:center">${e==2?'':`<p style="color:#fbbf24;font-weight:800;letter-spacing:2px">EMERGENCY MODE</p>`}
${e==0?`<h1>Press and hold to activate SOS</h1><p class="mu">Demo only · no real alert is sent</p><button class="sos" onpointerdown="hs()" onpointerup="he()" onpointerleave="he()" onkeydown="if(event.key=='Enter')act()"><div class="hold"></div><span>SOS</span></button>`
:e==1?`<h1 style="color:#f87171">SOS ACTIVATED</h1><div class="card" style="text-align:left;margin-top:14px"><p style="color:#4ade80">✓ Emergency contacts notified</p><p style="color:#4ade80">✓ Live location sharing active</p><p style="color:#4ade80">✓ Emergency alert sent</p><p class="mu" style="margin-top:6px">Sharing location with 3 contacts · simulated</p></div>
<div class="grid"><button class="btn red" onclick="toast('Simulated: calling Police 100')">Call Police</button><button class="btn red" onclick="toast('Simulated: calling Ambulance 108')">Call Ambulance</button><button class="btn red" onclick="toast('Simulated: calling Fire & Rescue 101')">Fire & Rescue</button><button class="btn o" onclick="toast('Live location shared (simulated)')">Share Live Location</button></div>
<div class="card tl" style="text-align:left;margin-top:14px"><b>Timeline</b>${S.log.map(l=>`<div>${l}</div>`).join('')}</div><button class="btn gr" onclick="S.es=2;logE('Resolved');draw()">Mark Resolved</button>`
:`<h1 style="color:#4ade80;margin-top:50px">Emergency Resolved</h1><p class="mu">You are marked safe. Contacts will be told (simulated).</p><button class="btn gr" onclick="go('home','home')">Return Home</button>`}
${e<2?`<button class="btn o" onclick="go('home','home')">Cancel Emergency</button>`:''}</div>`}};
function stp(n){return `<div class="steps">${['Issue','Location','Details','Submitted'].map((t,i)=>`<div class="${i<n?'d':''}">${i+1} — ${t}</div>`).join('')}</div>`}
function draw(){const em=S.v=='emg';$('#app').className=em?'em':'';const m=$('#main');m.innerHTML=V[S.v]();m.scrollTop=0;$('#nav').style.display=em?'none':'flex';
const T=[['home','Home','home'],['explore','Explore','map'],['community','Community','people'],['safety','Safety','shield'],['profile','Profile','person']];
$('#nav').innerHTML=T.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="go('${t[0]}','${t[0]}')">${ic(t[2])}${t[1]}</button>`).join('');
requestAnimationFrame(()=>requestAnimationFrame(()=>{document.querySelectorAll('.bar i').forEach(e=>e.style.width=e.dataset.w+'%');document.querySelectorAll('.arc').forEach(e=>{const L=2*Math.PI*52;e.style.strokeDashoffset=L*(1-e.dataset.v/100)})}))}
draw();
</script></body></html>
